name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instala o pacote
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Confere que as fixtures versionadas batem com o gerador
        # Fixture editada à mão sem passar pelo gerador vira teste que só passa
        # na máquina de quem editou.
        run: |
          python tests/make_fixtures.py
          git diff --exit-code -- tests/fixtures

      - name: Lint
        run: python -m ruff check .

      - name: Formatação
        run: python -m ruff format --check .

      - name: Testes
        run: python -m pytest -q --cov=ofxbr --cov-report=term-missing
