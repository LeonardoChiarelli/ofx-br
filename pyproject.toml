[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ofx-br"
version = "0.1.0"
description = "Leitor de OFX que aguenta o que os bancos brasileiros exportam: SGML sem fechamento, cp1252 e deduplicação por FITID."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Leonardo Chiarelli", email = "leonardo@chiarelli.dev" }]
keywords = ["ofx", "extrato", "bancario", "conciliacao", "brasil", "sgml", "fitid"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Portuguese (Brazilian)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Accounting",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/chiarelli-dev/ofx-br"
Issues = "https://github.com/chiarelli-dev/ofx-br/issues"

[project.scripts]
ofxbr = "ofxbr.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/ofxbr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
